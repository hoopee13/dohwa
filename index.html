<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>도화살 연애사주</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700;900&display=swap">
<style>
/* Layout: 춘절 포스터처럼 회문(回紋) 이중 프레임 안에 대칭 구성. 가운데 족자에 세로 한자, 양옆에 선화 등롱.
   풀이는 이중 괘선 패널 + 리본 제목으로 이어짐. 라이트 = 미색 한지에 주홍 선 / 다크 = 붉은 바탕에 미색·금 선 */
:root{
  --bg:#f3ebdc;
  --panel:#f8f2e6;
  --line:#b31d1c;
  --ink:#3b1511;
  --muted:#8a5a4e;
  --gold:#c19340;
  --fill:#b31d1c;
  --on-fill:#f8f2e6;
  --tile:#fbf6ec;
  --e0:#2e6a4c; --e1:#c0221f; --e2:#b8862a; --e3:#7c7a74; --e4:#1f2f4a;
  --f-display:"Noto Serif KR","Hahmlet",serif;
  --f-hanja:"Noto Serif KR",serif;
  --f-body:"Noto Serif KR","AppleMyungjo","Batang",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#8c1514;--panel:#981b19;--line:#f2e4c9;--ink:#fbf2e2;--muted:#f0cdb8;--gold:#e8bd62;--fill:#f2e4c9;--on-fill:#8c1514;--tile:#fbf3e4;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#8c1514;--panel:#981b19;--line:#f2e4c9;--ink:#fbf2e2;--muted:#f0cdb8;--gold:#e8bd62;--fill:#f2e4c9;--on-fill:#8c1514;--tile:#fbf3e4;color-scheme:dark}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.8;
  word-break:keep-all;overflow-wrap:break-word;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:24px 48px;
}
svg.defs{position:absolute;width:0;height:0;overflow:hidden}
.orn{color:var(--line);fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.orn.gold{color:var(--gold)}

/* 바깥 포스터 프레임 */
.poster{max-width:520px;margin:6px auto;position:relative;border:1.5px solid var(--line);outline:1.5px solid var(--line);outline-offset:6px;padding:28px 18px 30px;display:flex;flex-direction:column;gap:22px}
.corner{position:absolute;width:26px;height:26px}
.corner.tl{top:-1px;left:-1px}.corner.tr{top:-1px;right:-1px;transform:scaleX(-1)}
.corner.bl{bottom:-1px;left:-1px;transform:scaleY(-1)}.corner.br{bottom:-1px;right:-1px;transform:scale(-1)}

/* 히어로 */
header{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.plaque{position:relative;border:1.5px solid var(--line);outline:1.5px solid var(--line);outline-offset:3px;padding:4px 22px;display:flex;flex-direction:column;align-items:center;line-height:1.3}
.plaque b{font-family:var(--f-hanja);font-weight:900;font-size:24px;letter-spacing:.35em;margin-right:-.35em;color:var(--line)}
.plaque small{font-size:10px;font-weight:700;letter-spacing:.25em;color:var(--muted)}
.stage{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;width:100%;gap:4px;position:relative}
.lanterns{display:flex;justify-content:space-evenly;align-items:flex-start}
.lanterns svg{width:34px;height:84px}
.lanterns svg:nth-child(2){margin-top:38px;width:28px;height:70px}
.scroll-v{position:relative;padding:16px 14px;border:1.5px solid var(--line);outline:1.5px solid var(--line);outline-offset:-6px;background:var(--panel);display:flex;flex-direction:column;align-items:center;gap:2px;margin-block:10px}
.scroll-v::before,.scroll-v::after{content:"";position:absolute;left:-10px;right:-10px;height:9px;border:1.5px solid var(--line);border-radius:5px;background:var(--panel)}
.scroll-v::before{top:-10px}.scroll-v::after{bottom:-10px}
.scroll-v span{font-family:var(--f-hanja);font-weight:900;font-size:clamp(46px,14vw,62px);line-height:1.08;color:var(--line)}
.rays{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(34px,10.5vw,50px);line-height:1.2;margin:2px 0 0;letter-spacing:-.03em;text-wrap:balance}
h1 b{color:var(--line);font-weight:900;background:linear-gradient(transparent 62%,color-mix(in srgb,var(--gold) 45%,transparent) 62%)}
.ribbon-band{position:relative;display:inline-flex;align-items:center;padding:6px 26px;border-block:1.5px solid var(--line);font-size:14px;font-weight:700;color:var(--ink)}
.ribbon-band::before,.ribbon-band::after{content:"";position:absolute;top:50%;width:14px;height:14px;border:1.5px solid var(--line);transform:translateY(-50%) rotate(45deg);background:var(--bg)}
.ribbon-band::before{left:-7px}.ribbon-band::after{right:-7px}
.clouds{display:flex;justify-content:space-between;width:100%;margin-top:-6px}
.clouds svg{width:84px;height:30px}

/* 패널 */
.panel{background:var(--panel);border:1.5px solid var(--line);box-shadow:inset 0 0 0 4px var(--panel),inset 0 0 0 5.5px var(--line);padding:22px 18px;position:relative}
.panel.fill{background:var(--fill);color:var(--on-fill);box-shadow:inset 0 0 0 4px var(--fill),inset 0 0 0 5.5px var(--on-fill);border-color:var(--fill)}
.head{display:flex;align-items:center;gap:10px;margin:0 0 14px;padding-top:20px}
.head::before,.head::after{content:"";flex:1;height:0;border-top:1.5px solid currentColor;opacity:.55}
.head h3{margin:0;position:relative;line-height:1.3;text-align:center}
.head h3 i{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);white-space:nowrap;padding-bottom:2px;font-style:normal;font-family:var(--f-hanja);font-weight:900;font-size:13px;letter-spacing:.3em;margin-right:-.3em;color:var(--gold)}
.head h3 span{font-family:var(--f-display);font-weight:800;font-size:18px}
.panel:not(.fill) .head{color:var(--line)}
.panel:not(.fill) .head h3 span{color:var(--ink)}
.panel.fill .head h3 i{color:var(--on-fill);opacity:.8}

/* 입력 */
form.panel{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
form .head{grid-column:1/-1;margin-bottom:0}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
label{font-size:12px;font-weight:800;color:var(--muted)}
input,select{font:inherit;font-weight:700;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);padding:11px 12px;border-radius:0;width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.go{grid-column:1/-1;font-family:var(--f-display);font-weight:900;font-size:21px;background:var(--fill);color:var(--on-fill);border:0;box-shadow:inset 0 0 0 4px var(--fill),inset 0 0 0 5.5px var(--on-fill);padding:15px;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:12px}
.go svg{width:14px;height:14px;fill:currentColor}
.go:hover{filter:brightness(1.08)}
.example-tag{grid-column:1/-1;font-size:12px;color:var(--muted);margin:0;font-weight:600;text-align:center}

#out{display:flex;flex-direction:column;gap:22px}

/* 원국 */
.wonguk{display:grid;grid-template-columns:2.4em repeat(4,1fr);gap:6px;text-align:center;align-items:stretch}
.rowh{font-size:11px;font-weight:800;color:var(--muted);display:grid;place-items:center;writing-mode:vertical-rl;letter-spacing:.1em}
.colh{font-size:12px;font-weight:800;color:var(--muted)}
.colh.me,.ten.me{color:var(--line)}
.ten{font-size:12px;font-weight:700;color:var(--muted)}
.tile{background:var(--tile);border:1.5px solid var(--line);box-shadow:inset 0 0 0 3px var(--tile),inset 0 0 0 4px var(--line);aspect-ratio:1/1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tile .hz{font-family:var(--f-hanja);font-weight:900;font-size:clamp(28px,8.4vw,40px);line-height:1}
.tile .kr{font-size:11px;font-weight:800;color:#5a463e}
.tile.me{background:var(--fill);box-shadow:inset 0 0 0 3px var(--fill),inset 0 0 0 4px var(--on-fill)}
.tile.me .hz,.tile.me .kr{color:var(--on-fill)!important}
.tile.unk{background:transparent;border-style:dashed;box-shadow:none;color:var(--muted)}
.tile.unk .kr{color:var(--muted)}
.sinsal{display:flex;flex-direction:column;gap:3px;align-items:center;min-height:1.6em}
.ss{font-size:11px;font-weight:800;padding:0 7px;border:1px solid var(--line);color:var(--ink);line-height:1.6;white-space:nowrap}
.ss.hot{background:var(--fill);color:var(--on-fill);border-color:var(--fill)}

.ohaeng-wrap{display:grid;grid-template-columns:1fr;justify-items:center;margin-top:12px}
.ohaeng-wrap svg{width:100%;max-width:300px;height:auto}
.oh-note{margin:6px 0 0;font-size:14px;font-weight:600;line-height:1.75;text-align:center}

/* 일주 */
.ilju{display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center}
.ilju .nm{font-size:13px;font-weight:800;color:var(--line)}
.ilju h2{font-family:var(--f-display);font-weight:900;font-size:clamp(30px,9vw,40px);line-height:1.18;margin:0;letter-spacing:-.02em;text-wrap:balance}
.ilju .tag{grid-column:1/-1;margin:8px 0 0;font-size:16px;font-weight:600}
.mini-scroll{grid-row:1/3;grid-column:2;border:1.5px solid var(--line);outline:1.5px solid var(--line);outline-offset:-5px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;position:relative}
.mini-scroll span{font-family:var(--f-hanja);font-weight:900;font-size:38px;line-height:1.05;color:var(--line)}

/* 판정 */
.verdict{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center}
.score small{display:block;font-size:12px;font-weight:800;color:var(--muted)}
.score b{font-family:var(--f-display);font-weight:900;font-size:clamp(76px,23vw,100px);line-height:.95;font-variant-numeric:tabular-nums;color:var(--line);letter-spacing:-.04em}
.score em{font-style:normal;font-weight:800;color:var(--muted);font-size:16px}
.stamp{width:92px;height:92px;background:var(--fill);color:var(--on-fill);display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-weight:900;font-size:20px;line-height:1.15;transform:rotate(-6deg);box-shadow:inset 0 0 0 4px var(--fill),inset 0 0 0 6px var(--on-fill);border-radius:6px}
.verdict h3{grid-column:1/-1;margin:6px 0 0;font-family:var(--f-display);font-weight:900;font-size:clamp(22px,6.4vw,27px);line-height:1.35;text-wrap:balance}
.verdict p{grid-column:1/-1;margin:0;font-weight:600}
.factors{list-style:none;margin:16px 0 0;padding:14px 0 0;border-top:1.5px dashed var(--line);display:flex;flex-direction:column;gap:10px}
.factors li{display:grid;grid-template-columns:3.2em 1fr;gap:12px;font-size:14px;line-height:1.65}
.pt{font-variant-numeric:tabular-nums;font-weight:800;text-align:right;color:var(--ink)}
.pt.minus{color:var(--line)}

/* 족자 팩폭 */
.scroll-h{position:relative;margin:10px 8px;padding:26px 18px;background:var(--panel);border-inline:1.5px solid var(--line);text-align:center}
.scroll-h::before,.scroll-h::after{content:"";position:absolute;left:-12px;right:-12px;height:12px;border:1.5px solid var(--line);border-radius:6px;background:var(--fill)}
.scroll-h::before{top:-6px}.scroll-h::after{bottom:-6px}
.scroll-h small{display:block;font-family:var(--f-hanja);font-weight:900;font-size:13px;letter-spacing:.5em;margin-right:-.5em;color:var(--gold);margin-bottom:8px}
.scroll-h p{margin:0;font-family:var(--f-display);font-weight:900;font-size:clamp(23px,6.8vw,29px);line-height:1.45;color:var(--line);text-wrap:balance}

.sec p{margin:0;font-size:16px;font-weight:600;line-height:1.85}
.sec .headline{font-family:var(--f-display);font-weight:900;font-size:clamp(24px,7vw,30px);line-height:1.3;margin:0 0 10px;text-align:center}
.panel.fill .sec-body{text-align:center}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pair .panel{padding:20px 14px}
.pair .sec p{font-size:15px}
.pair .head h3 span{font-size:16px}

.actions{display:flex;justify-content:center}
.btn2{font:inherit;font-weight:800;font-size:15px;background:transparent;color:var(--line);border:1.5px solid var(--line);outline:1.5px solid var(--line);outline-offset:3px;padding:11px 22px;cursor:pointer}
.btn2:hover{background:var(--fill);color:var(--on-fill)}
.note{font-size:12px;color:var(--muted);text-align:center;margin:0}
#copied{font-size:13px;font-weight:700;color:var(--line);text-align:center;margin:-8px 0 0;min-height:1.2em}

@keyframes rise{from{transform:translateY(10px);opacity:.25}to{transform:none;opacity:1}}
@keyframes press{0%{transform:rotate(-20deg) scale(1.8);opacity:0}70%{transform:rotate(-4deg) scale(.95);opacity:1}100%{transform:rotate(-6deg) scale(1)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.lanterns svg{transform-origin:50% 0;animation:sway 4s ease-in-out infinite}
.lanterns svg:nth-child(2){animation-delay:-1.5s}
#out.fresh > *{animation:rise .45s both ease-out}
#out.fresh > *:nth-child(2){animation-delay:.07s}#out.fresh > *:nth-child(3){animation-delay:.14s}
#out.fresh .stamp{animation:press .5s .35s both cubic-bezier(.3,1.4,.5,1)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (max-width:420px){
  .poster{padding:24px 12px 26px}
  form.panel{grid-template-columns:1fr}
  .pair{grid-template-columns:1fr}
  .stamp{width:80px;height:80px;font-size:17px}
  .lanterns svg{width:28px;height:70px}.lanterns svg:nth-child(2){width:22px;height:56px}
}
</style>

<svg class="defs" aria-hidden="true">
  <symbol id="lantern" viewBox="0 0 40 96">
    <path d="M20 0v10"/><rect x="12" y="10" width="16" height="5"/>
    <ellipse cx="20" cy="38" rx="16" ry="23"/><ellipse cx="20" cy="38" rx="9" ry="23"/><path d="M20 15v46M4 38h32"/>
    <rect x="12" y="61" width="16" height="5"/><path d="M20 66v6"/><path d="M20 72l3 3-3 3-3-3z"/><path d="M16 80v14M18 80v16M20 80v16M22 80v16M24 80v14"/>
  </symbol>
  <symbol id="cloud" viewBox="0 0 84 30">
    <path d="M2 27h80"/><path d="M14 27c-7 0-9-9-2-11 0-8 11-11 16-4 3-8 17-9 20 0 7-4 15 1 13 8 6 1 7 7 2 7"/><path d="M28 18c0-4 6-5 7-1"/>
  </symbol>
  <symbol id="spark" viewBox="0 0 20 20"><path d="M10 0l2 8 8 2-8 2-2 8-2-8-8-2 8-2z" fill="currentColor" stroke="none"/></symbol>

</svg>

<div class="poster">
  <svg class="corner tl orn"><use href="#fret"/></svg><svg class="corner tr orn"><use href="#fret"/></svg>
  <svg class="corner bl orn"><use href="#fret"/></svg><svg class="corner br orn"><use href="#fret"/></svg>

  <header>
    <div class="plaque"><b>戀愛四柱</b><small>정통 만세력 연애사주</small></div>
    <div class="stage">
      <div class="lanterns"><svg class="orn"><use href="#lantern"/></svg><svg class="orn"><use href="#lantern"/></svg></div>
      <div class="scroll-v" aria-label="도화살"><span>桃</span><span>花</span><span>煞</span></div>
      <div class="lanterns"><svg class="orn"><use href="#lantern"/></svg><svg class="orn"><use href="#lantern"/></svg></div>
      <svg class="rays orn gold" viewBox="0 0 400 260" preserveAspectRatio="none" aria-hidden="true">
        <use href="#spark" x="60" y="200" width="14" height="14"/><use href="#spark" x="330" y="190" width="14" height="14"/>
        <use href="#spark" x="110" y="20" width="10" height="10"/><use href="#spark" x="285" y="30" width="10" height="10"/>
        <use href="#spark" x="24" y="120" width="9" height="9"/><use href="#spark" x="372" y="110" width="9" height="9"/>
      </svg>
    </div>
    <div class="clouds"><svg class="orn"><use href="#cloud"/></svg><svg class="orn" style="transform:scaleX(-1)"><use href="#cloud"/></svg></div>
    <h1>네 사주에<br><b>도화살</b> 있는지<br>까보자</h1>
    <div class="ribbon-band">생년월일시로 원국·십성·신살까지 다 깜</div>
  </header>

  <form id="f" class="panel" autocomplete="off">

</div>

<script>
const STEMS="甲乙丙丁戊己庚辛壬癸",STEMS_KR="갑을병정무기경신임계";
const BR="子丑寅卯辰巳午未申酉戌亥",BR_KR="자축인묘진사오미신유술해";
const STEM_EL=[0,0,1,1,2,2,3,3,4,4];
const BR_EL=[4,2,0,0,2,1,1,2,3,3,2,4];
const EL=["목","화","토","금","수"],EL_H=["木","火","土","金","水"];
const HOURS=[["모름",-1],["23:30–01:29 자시",0],["01:30–03:29 축시",1],["03:30–05:29 인시",2],["05:30–07:29 묘시",3],["07:30–09:29 진시",4],["09:30–11:29 사시",5],["11:30–13:29 오시",6],["13:30–15:29 미시",7],["15:30–17:29 신시",8],["17:30–19:29 유시",9],["19:30–21:29 술시",10],["21:30–23:29 해시",11]];
const sel=document.getElementById("bt");
HOURS.forEach(([t,v])=>{const o=document.createElement("option");o.value=v;o.textContent=t;sel.appendChild(o)});
sel.value="9";

const TERMS=[[2,4],[3,6],[4,5],[5,6],[6,6],[7,7],[8,8],[9,8],[10,8],[11,7],[12,7],[1,6]];
const mod=(a,n)=>((a%n)+n)%n;

function pillars(y,m,d,hb){
  const jdn=Date.UTC(y,m-1,d)/864e5+2440588;
  const day=mod(jdn+49,60);
  const sy=(m<2||(m===2&&d<4))?y-1:y;
  const yr=mod(sy-4,60);
  let mi=0;
  for(let i=0;i<12;i++){
    const [tm,td]=TERMS[i],[nm,nd]=TERMS[(i+1)%12];
    const t=tm*100+td,n=nm*100+nd,c=m*100+d;
    if(t<n?(c>=t&&c<n):(c>=t||c<n)){mi=i;break}
  }
  const ms=mod((yr%10%5)*2+2+mi,10),mb=mod(mi+2,12);
  const ds=day%10,db=day%12;

 0:["2027 정미년은 네가 불을 뿜는 해.","끼가 폭발해서 먼저 고백하거나 들이대게 돼.","표현은 좋은데 술자리 말실수 조심.","상반기에 시작한 썸이 제일 오래 간다."],
 1:["2027 정미년은 너랑 같은 불의 해.","썸에 라이벌이 끼어들거나, 친구랑 같은 사람을 좋아하게 돼.","질투가 시험대야.","이기려고 들면 사람도 친구도 다 잃어."],
 2:["2027 정미년은 불이 너를 데워주는 해.","챙겨주는 사람, 연상이나 어른스러운 사람이 들어와.","문제는 네가 받는 걸 어색해한다는 거.","이번엔 밀어내지 마."],
 3:["2027 정미년은 불이 너를 녹이는 해.","강하고 주도적인 사람한테 확 끌려.","휘둘리기 쉬운 해라 정신 꽉 잡아.","\"이 사람이다\" 싶을 때 한 달만 더 지켜봐."],
 4:["2027 정미년은 네가 불을 다스리는 해.","원하는 사람을 손에 넣는 기운이 강해.","대신 소유욕이 문제야.","잡은 다음에 놓아주는 연습까지 해야 오래 가."]
};

/* 오행 관계 */
const genBy=e=>mod(e+1,5);   // e가 생하는 오행
const ctrlBy=e=>mod(e+2,5);  // e가 극하는 오행 (재성)
const ctrlOf=e=>mod(e+3,5);  // e를 극하는 오행 (관성)

function loveScore(cnt,dm,dohwaN,hong){
  const f=[];let s=50;
  if(dohwaN>0){const v=dohwaN>1?22:14;s+=v;f.push([v,`도화살 ${dohwaN>1?"겹침":"있음"}. 가만히 있어도 눈길이 와.`])}
  else{s-=6;f.push([-6,"도화살 없음. 얼굴로 먹고 들어가는 거 없어."])}
  if(hong){s+=10;f.push([10,"홍염살 있음. 가까워질수록 빠져드는 은근한 색기."])}
  const fire=cnt[1];
  if(fire===0){s-=12;f.push([-12,"화(火) 0개. 표현력 바닥. 좋아해도 상대가 몰라."])}
  else if(fire>=3){s+=4;f.push([4,"화(火) 넘침. 표현은 화끈한데 쉽게 식어."])}
  else{s+=6;f.push([6,"화(火) 적당. 마음을 표현할 줄은 알아."])}
  const jae=cnt[ctrlBy(dm)],gwan=cnt[ctrlOf(dm)];
  if(jae+gwan===0){s-=18;f.push([-18,"재성·관성 0개. 사주에 이성 인연 기운이 안 보여. 이건 발로 뛰어서 채워야 해."])}
  else if(jae+gwan>=4){s+=8;f.push([8,"재성·관성이 많아. 인연은 계속 들어와. 고르는 게 문제야."])}
  else{s+=4;f.push([4,"재성·관성 보통. 인연은 있어. 잡느냐가 문제지."])}
  const self=cnt[dm];
  if(self>=4){s-=10;f.push([-10,`${EL[dm]}(일간과 같은 기운) ${self}개. 네 세계가 너무 커서 남이 들어갈 자리가 없어.`])}
  const zeros=cnt.filter(c=>c===0).length;
  if(zeros>=2){s-=6;f.push([-6,`빠진 오행 ${zeros}개. 연애에서 균형 잡기가 어려워.`])}
  s=Math.max(5,Math.min(98,s));
  return {s,f};
}
function grade(s){
  if(s>=85) return {stamp:"연애\n고수",h:"연애 체질 맞아. 근데 그게 문제야.",p:["사람이 끊이질 않아서 하나한테 집중을 못 해.","지금 솔로라면 그건 운이 아니라 네 선택이야."]};
  if(s>=70) return {stamp:"연애\n가능",h:"하려면 해. 지금은 안 하는 거야.",p:["사주는 문제없어.","문제는 네가 핑계를 너무 잘 만든다는 거."]};
  if(s>=50) return {stamp:"애매\n판정",h:"평균이야. 근데 평균은 아무도 안 쳐다봐.",p:["기다리면 오는 사주가 아니야.","네가 한 발 먼저 가야 그제야 시작돼."]};
  if(s>=30) return {stamp:"연애\n못함",h:"솔직히 말할게. 너 연애 못 해.",p:["사주 탓 반, 네 탓 반이야.","아래 '솔로인 이유' 읽고 하나라도 고치면 달라져."]};
  return {stamp:"재능\n미달",h:"연애 재능 미달. 노력으로 커버해야 해.",p:["타고난 인연 기운이 약해.","대신 노력형은 한번 잡으면 안 놓쳐. 그게 네 무기야."]};
}

const lines=a=>a.map(esc).join("<br>");
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]))}
const BR_MAIN=[9,5,0,1,4,2,3,5,6,7,4,8];
const TEN=[["비견","겁재"],["식신","상관"],["편재","정재"],["편관","정관"],["편인","정인"]];
function tenGod(d,x){return TEN[mod(STEM_EL[x]-STEM_EL[d],5)][(d%2)===(x%2)?0:1]}
const YEOK={8:2,0:2,4:2,2:8,6:8,10:8,5:11,9:11,1:11,11:5,3:5,7:5};
const HWAGAE={8:4,0:4,4:4,2:10,6:10,10:10,5:1,9:1,1:1,11:7,3:7,7:7};

let lastText="";

function pentagon(cnt){
  const cx=150,cy=148,R=100,pts=[];
  for(let i=0;i<5;i++){const a=(-90+72*i)*Math.PI/180;pts.push([cx+R*Math.cos(a),cy+R*Math.sin(a)])}
  const star=[0,2,4,1,3].map(i=>pts[i].map(v=>v.toFixed(1)).join(",")).join(" ");
  let g=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--line)" stroke-width="1.5"/>
  <circle cx="${cx}" cy="${cy}" r="${R-6}" fill="none" stroke="var(--line)" stroke-width=".8" stroke-dasharray="2 4"/>
  <polygon points="${star}" fill="none" stroke="var(--gold)" stroke-width="1.2"/>`;
  pts.forEach(([x,y],i)=>{
    const c=cnt[i],r=Math.min(38,17+c*5);
    if(c===0){
      g+=`<circle cx="${x}" cy="${y}" r="${r}" fill="var(--panel)" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="3 3"/>
      <text x="${x}" y="${y+6}" text-anchor="middle" font-family="Noto Serif KR,serif" font-weight="900" font-size="17" fill="var(--muted)">${EL_H[i]}</text>`;
    }else{
      g+=`<circle cx="${x}" cy="${y}" r="${r+4}" fill="var(--panel)" stroke="var(--line)" stroke-width="1.2"/>
      <circle cx="${x}" cy="${y}" r="${r}" fill="var(--e${i})"/>
      <text x="${x}" y="${y+7}" text-anchor="middle" font-family="Noto Serif KR,serif" font-weight="900" font-size="${16+c*2}" fill="#fff">${EL_H[i]}</text>`;
    }
    const ly=i===0?y-r-12:y+r+18;
    g+=`<text x="${x}" y="${ly}" text-anchor="middle" font-family="Noto Serif KR,serif" font-weight="800" font-size="13" fill="var(--ink)">${EL[i]} ${c}</text>`;
  });
  return `<svg viewBox="0 0 300 300" role="img" aria-label="오행 분포: ${cnt.map((c,i)=>EL[i]+" "+c+"개").join(", ")}">${g}</svg>`;
}

function render(fresh){
  const bd=document.getElementById("bd").value;
  if(!bd)return;
  const [y,m,d]=bd.split("-").map(Number);
  const hb=Number(sel.value);
  const p=pillars(y,m,d,hb);
  const ds=p.day[0],db=p.day[1],dm=STEM_EL[ds];
  const prof=P[ds];
  const ilju=STEMS_KR[ds]+BR_KR[db]+"일주";
  const KEYS=["hour","day","month","year"];

  const cnt=[0,0,0,0,0];
  KEYS.forEach(k=>{if(p[k]){cnt[STEM_EL[p[k][0]]]++;cnt[BR_EL[p[k][1]]]++}});

  const branches=KEYS.filter(k=>p[k]).map(k=>p[k][1]);
  const dTarget=new Set([DOHWA[p.year[1]],DOHWA[db]]);
  const dohwaN=branches.filter(b=>dTarget.has(b)).length;
  const hasHong=branches.some(b=>HONG[ds].includes(b));
  const {s,f}=loveScore(cnt,dm,dohwaN,hasHong);
  const g=grade(s);

  let sal;
  if(dohwaN&&hasHong) sal=["도화살에 홍염살까지 있어.","가만히 있어도 사람이 꼬이고","한 번 엮이면 상대가 못 빠져나가.","문제는 너도 못 빠져나간다는 거."];
  else if(dohwaN>1) sal=["도화살이 겹쳐 있어.","본인은 평범하다는데 주변에선 \"쟤 왜 인기 많아?\" 소리 나와.","썸이 끊긴 적 없지?","근데 썸만 있고 연애는 없다면, 그건 네가 고르기만 해서야."];
  else if(dohwaN) sal=["도화살 있어.","웃을 때 분위기가 확 바뀌는 타입이야.","의도 안 해도 오해를 만들어.","그 오해 중 하나가 진짜 인연일 수도 있어."];
  else if(hasHong) sal=["도화살은 없고 홍염살만 있어.","첫눈에 반하게 하는 얼굴은 아닌데","가까워질수록 빠져드는 사람이야.","친구였던 사람이 고백하는 패턴, 겪어봤지?"];
  else sal=["도화살도 홍염살도 없어.","첫인상으로 먹고 들어가는 타입이 아니야.","대화로 꼬셔야 해.","그러니까 말 걸 기회 자체를 만들어. 집에만 있으면 0이야."];

  const ex=[];cnt.forEach((c,i)=>{if(c>=3)ex.push(EXCESS[i]);if(c===0)ex.push(LACK[i])});
  const exText=ex.length?ex.map(lines).join("<br><br>"):"오행이 고르게 퍼져 있어.<br>연애에서 극단으로 안 가는 대신<br>\"너 좀 심심해\" 소리를 가끔 들어.";

  const COLN={hour:"시주",day:"일주",month:"월주",year:"연주"};
  const yT=[p.year[1],db];
  const ssOf=b=>{const r=[];
    if(dTarget.has(b))r.push(["도화","hot"]);
    if(HONG[ds].includes(b))r.push(["홍염","hot"]);
    if(yT.some(t=>YEOK[t]===b))r.push(["역마",""]);
    if(yT.some(t=>HWAGAE[t]===b))r.push(["화개",""]);
    return r};
  const tile=(ch,kr,el,me)=>`<div class="tile ${me?"me":""}"><span class="hz" style="color:var(--e${el})">${ch}</span><span class="kr">${kr}</span></div>`;
  const unk=`<div class="tile unk"><span class="hz">?</span><span class="kr">모름</span></div>`;
  let wg=`<div></div>`+KEYS.map(k=>`<div class="colh ${k==="day"?"me":""}">${COLN[k]}</div>`).join("");
  wg+=`<div class="rowh">십성</div>`+KEYS.map(k=>p[k]?(k==="day"?`<div class="ten me">일간 (나)</div>`:`<div class="ten">${tenGod(ds,p[k][0])}</div>`):`<div class="ten">-</div>`).join("");
  wg+=`<div class="rowh">천간</div>`+KEYS.map(k=>p[k]?tile(STEMS[p[k][0]],STEMS_KR[p[k][0]]+EL[STEM_EL[p[k][0]]],STEM_EL[p[k][0]],k==="day"):unk).join("");
  wg+=`<div class="rowh">지지</div>`+KEYS.map(k=>p[k]?tile(BR[p[k][1]],BR_KR[p[k][1]]+EL[BR_EL[p[k][1]]],BR_EL[p[k][1]],false):unk).join("");
  wg+=`<div class="rowh">십성</div>`+KEYS.map(k=>p[k]?`<div class="ten">${tenGod(ds,BR_MAIN[p[k][1]])}</div>`:`<div class="ten">-</div>`).join("");
  wg+=`<div class="rowh">신살</div>`+KEYS.map(k=>`<div class="sinsal">${p[k]?ssOf(p[k][1]).map(([t,c])=>`<span class="ss ${c}">${t}</span>`).join(""):""}</div>`).join("");

  const facRows=f.map(([v,t])=>`<li><span class="pt ${v<0?"minus":""}">${v>0?"+":""}${v}</span><span>${esc(t)}</span></li>`).join("");
  const head=(h,k)=>`<div class="head"><h3><i>${h}</i><span>${k}</span></h3></div>`;

  const out=document.getElementById("out");
  out.innerHTML=`
    <section class="panel">
      ${head("原局","내 사주 원국")}
      <div class="wonguk">${wg}</div>
      <div class="ohaeng-wrap">${pentagon(cnt)}</div>
      <p class="oh-note">${exText}</p>
    </section>

    <section class="panel ilju">
      <span class="nm">${ilju} · 일간 ${EL[dm]}(${EL_H[dm]})</span>
      <h2>${esc(prof.title)}</h2>
      <div class="mini-scroll" aria-hidden="true"><span>${STEMS[ds]}</span><span>${BR[db]}</span></div>
      <p class="tag">${lines(prof.tag)}</p>
    </section>

    <section class="panel">
      ${head("戀愛力","연애력 판정")}
      <div class="verdict">
        <div class="score"><small>100점 만점</small><b>${s}</b><em> 점</em></div>
        <div class="stamp" aria-hidden="true">${g.stamp.replace("\n","<br>")}</div>
        <h3>${esc(g.h)}</h3>
        <p>${lines(g.p)}</p>
      </div>
      <ul class="factors">${facRows}</ul>
    </section>

    <div class="scroll-h"><small>一喝</small><p>“${lines(prof.punch)}”</p></div>

    <section class="panel fill sec">
      ${head("孤獨","너 지금 솔로인 이유")}
      <p class="headline">${esc(prof.single[0])}</p>
      <p class="sec-body">${lines(prof.single.slice(1))}</p>
    </section>

    <section class="panel sec">${head("桃花 紅艶","도화살 · 홍염살 판정")}<p>${lines(sal)}</p></section>

    <div class="pair">
      <section class="panel sec">${head("敗","썸에서 망하는 지점")}<p>${lines(prof.sum)}</p></section>
      <section class="panel sec">${head("弱","치명적 약점")}<p>${lines(prof.weak)}</p></section>
    </div>

    <section class="panel sec">${head("戀愛型","연애 스타일")}<p>${lines(prof.style)}</p></section>

    <div class="pair">
      <section class="panel sec">${head("落","이런 사람한테 무너짐")}<p>${lines(prof.fall)}</p></section>
      <section class="panel sec">${head("別","헤어질 때 너")}<p>${lines(prof.end)}</p></section>
    </div>

    <section class="panel sec">${head("丁未年","2027년 연애운")}<p>${lines(Y2027[dm])}</p></section>`;
  if(fresh){out.classList.remove("fresh");void out.offsetWidth;out.classList.add("fresh")}
  lastText=`[연애사주] ${ilju} – ${prof.title}\n연애력 ${s}/100 · ${g.h}\n\n솔로인 이유:\n${prof.single.join("\n")}\n\n"${prof.punch.join(" ")}"\n${dohwaN?"도화살 있음":"도화살 없음"} / ${hasHong?"홍염살 있음":"홍염살 없음"}`;
}

document.getElementById("f").addEventListener("submit",e=>{
  e.preventDefault();
  document.getElementById("exTag").hidden=true;
  render(true);
  document.getElementById("out").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
});
document.getElementById("copy").addEventListener("click",()=>{
  const msg=document.getElementById("copied");
  navigator.clipboard.writeText(lastText).then(()=>{msg.textContent="복사했어. 단톡방에 던져봐."}).catch(()=>{msg.textContent="복사가 막혔어. 결과를 길게 눌러 직접 복사해줘."});
});
render(false);
</script>

</body></html>
